<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Recipes - EasyRecipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pink-light': '#FFE4E9',
                        'pink-medium': '#FFB3C1',
                        'pink-dark': '#FF8FA3',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-pink-light to-white min-h-screen">
	<!-- Header with Hamburger Menu -->
	<header class="bg-white shadow-sm">
		<div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
			<h1 class="text-2xl font-bold text-pink-dark">EasyRecipe</h1>
			
			<!-- Hamburger Menu Button -->
			<button id="menuBtn" onclick="toggleMenu()" class="text-pink-dark hover:text-pink-medium transition focus:outline-none">
				<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
				</svg>
			</button>
		</div>
		
		<!-- Dropdown Menu -->
		<div id="mobileMenu" class="hidden absolute right-4 top-16 bg-white rounded-lg shadow-xl border-2 border-pink-light z-50 w-64">
			<nav class="py-2">
				<a href="/extract" class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">
					Extract from Video
				</a>
				<a href="/make-your-own" class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">
					Make Your Own
				</a>
				<a href="/ai-recipe" class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">
					AI Recipe Builder
				</a>
				<a href="/recipes" class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">
					My Recipes
				</a>
				<hr class="my-2 border-pink-light">
				<button onclick="logout()" class="block w-full text-left px-6 py-3 text-red-600 hover:bg-red-50 transition">
					Logout
				</button>
			</nav>
		</div>
	</header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">My Saved Recipes</h2>
            
            <!-- Loading State -->
            <div id="loading" class="text-center py-8">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-pink-dark"></div>
                <p class="mt-4 text-gray-600">Loading recipes...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <p class="text-gray-500 text-lg mb-4">You haven't saved any recipes yet.</p>
                <a href="/extract" class="inline-block bg-pink-dark hover:bg-pink-medium text-white font-semibold px-6 py-3 rounded-lg transition">
                    Extract Your First Recipe
                </a>
            </div>

            <!-- Recipes Grid -->
            <div id="recipesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

            <!-- Message Display -->
            <div id="message" class="mt-4 p-4 rounded-lg hidden"></div>
        </div>
    </main>

	<script src="/js/utils.js"></script>
	<script src="/js/recipes.js"></script>
</body>
</html>
