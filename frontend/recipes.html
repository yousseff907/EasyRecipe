	<meta charset="UTF-8">

	<title>My Recipes - EasyRecipe	</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						'pink-light': '#FFE4E9',
						'pink-medium': '#FFB3C1',
						'pink-dark': '#FF8FA3',
					}

<!-- AFTER (correct) -->

<body class="bg-gradient-to-br from-pink-light to-white min-h-screen flex flex-col">
	<!-- Header with Hamburger Menu -->
	<!-- Header with Hamburger Menu & Translate -->
	<header class="bg-white shadow-sm">
		<div class="w-full px-4 py-4">
			<!-- Desktop Header -->
			<div class="flex justify-between items-center">
				<h1 class="text-2xl font-bold text-pink-dark">EasyRecipe</h1>

				<div class="flex items-center gap-3">
					<!-- Google Translate Widget -->
					<div id="google_translate_element"></div>

					<!-- Hamburger Menu Button -->
					<button id="menuBtn" onclick="toggleMenu()"
						class="text-pink-dark hover:text-pink-medium transition focus:outline-none">
						<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
								d="M4 6h16M4 12h16M4 18h16"></path>
						</svg>
					</button>
				</div>
			</div>
		</div>

		<!-- Dropdown Menu -->
		<div id="mobileMenu"
			class="hidden absolute right-4 top-16 bg-white rounded-lg shadow-xl border-2 border-pink-light z-50 w-64">
			<nav class="py-2">
				<a href="/extract"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">
					Extract from Video
				</a>
				<a href="/make-your-own"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">
					Make Your Own
				</a>
				<a href="/ai-recipe"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">
					AI Recipe Builder
				</a>
				<a href="/recipes"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">
					My Recipes
				</a>
				<a href="/settings"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">
					Settings
				</a>
				<hr class="my-2 border-pink-light">
				<button onclick="logout()"
					class="block w-full text-left px-6 py-3 text-red-600 hover:bg-red-50 transition">
					Logout
				</button>
			</nav>
		</div>
	</header>

	<!-- Google Translate Script -->
	<script type="text/javascript">
		function googleTranslateElementInit() {
			new google.translate.TranslateElement(
				{
					pageLanguage: 'en',
					includedLanguages: 'en,ar,fr,es,it,de,pt,ru,zh-CN,ja,ko,tr,hi',
					layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
					autoDisplay: false
				},
				'google_translate_element'
			);
		}
	</script>
	<script type="text/javascript"
		src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

	<!-- Custom Styling -->
	<style>
		/* Google Translate Widget Styling */
		#google_translate_element {
			display: inline-block;
		}

		/* Hide Google's annoying top banner */
		.goog-te-banner-frame.skiptranslate {
			display: none !important;
		}

		/* Remove body top margin added by Google Translate */
		body {
			top: 0px !important;
		}

		/* Style the language dropdown to match pink theme */
		.goog-te-combo {
			padding: 8px 12px;
			border: 2px solid #FFB3C1;
			border-radius: 8px;
			background-color: white;
			color: #FF8FA3;
			font-size: 14px;
			font-weight: 500;
			cursor: pointer;
			outline: none;
			transition: all 0.2s;
		}

		.goog-te-combo:hover {
			border-color: #FF8FA3;
			background-color: #FFE4E9;
		}

		.goog-te-combo:focus {
			border-color: #FF8FA3;
			box-shadow: 0 0 0 3px rgba(255, 179, 193, 0.3);
		}

		/* Mobile responsive */
		@media (max-width: 640px) {
			.max-w-7xl>.flex {
				flex-wrap: wrap;
				gap: 8px;
			}

			#google_translate_element {
				order: 3;
				width: 100%;
				margin-top: 8px;
			}

			.goog-te-combo {
				width: 100%;
			}
		}
	</style>


	<!-- Main Content -->
	<main class="max-w-7xl mx-auto px-4 py-8">
		<div class="bg-white rounded-2xl shadow-xl p-8">
			<h2 class="text-3xl font-bold text-gray-800 mb-6">My Saved Recipes</h2>

			<!-- Loading State -->
			<div id="loading" class="text-center py-8">
				<div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-pink-dark"></div>
				<p class="mt-4 text-gray-600">Loading recipes...</p>
			</div>

			<!-- Empty State -->
			<div id="emptyState" class="hidden text-center py-12">
				<p class="text-gray-500 text-lg mb-4">You haven't saved any recipes yet.</p>
				<a href="/extract"
					class="inline-block bg-pink-dark hover:bg-pink-medium text-white font-semibold px-6 py-3 rounded-lg transition">
					Extract Your First Recipe
				</a>
			</div>

			<!-- Recipes List Container -->
			<div id="recipesList" class="hidden">
				<div id="recipesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
			</div>

			<!-- Message Display -->
			<div id="message" class="mt-4 p-4 rounded-lg hidden"></div>
		</div>
	</main>

	<!-- Footer -->
	<footer class="bg-white border-t mt-auto">
		<div class="w-full px-4 py-6 text-center text-gray-600 text-sm">
			<p>&copy; 2026 EasyRecipe. All rights reserved.</p>
			<div class="mt-2 space-x-4">
				<a href="/privacy" class="text-pink-dark hover:underline">Privacy Policy</a>
				<a href="/terms" class="text-pink-dark hover:underline">Terms of Service</a>
				<a href="/about" class="text-pink-dark hover:underline">About</a>
				<a href="/contact" class="text-pink-dark hover:underline">Contact</a>
			</div>
		</div>
	</footer>

	<script src="/js/utils.js"></script>
	<script src="/js/recipes.js"></script>
</body>

</html>
