<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Public Recipes - EasyRecipe</title>
	<meta name="description" content="Browse public recipes extracted from cooking videos on TikTok and Facebook.">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<link rel="stylesheet" href="/output.css">
    <meta property="og:image" content="https://__SITE_DOMAIN__/android-chrome-512x512.png">
    <meta property="og:image:type" content="image/png">
</head>

<body class="bg-gradient-to-br from-pink-light to-white min-h-screen flex flex-col">
	<header class="bg-white shadow-sm">
		<div class="w-full px-4 py-4">
			<div class="flex justify-between items-center">
				<a href="/" class="text-2xl font-bold text-pink-dark">EasyRecipe</a>
				<a href="/login" class="bg-pink-dark hover:bg-pink-medium text-white font-semibold px-4 py-2 rounded-lg transition text-sm">
					Sign In
				</a>
			</div>
		</div>
	</header>

	<main class="max-w-7xl mx-auto px-4 py-8 w-full flex-1">
		<div class="bg-white rounded-2xl shadow-xl p-8">
			<h1 class="text-3xl font-bold text-gray-800 mb-2">Public Recipes</h1>
			<p class="text-gray-500 mb-8">Browse recipes shared by the EasyRecipe community.</p>

			<div id="loading" class="text-center py-8">
				<div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-pink-dark"></div>
				<p class="mt-4 text-gray-600">Loading recipes...</p>
			</div>

			<div id="recipesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

			<div id="emptyState" class="hidden text-center py-12">
				<p class="text-gray-500 text-lg mb-4">No public recipes yet.</p>
				<a href="/login" class="inline-block bg-pink-dark hover:bg-pink-medium text-white font-semibold px-6 py-3 rounded-lg transition">
					Join EasyRecipe
				</a>
			</div>
		</div>
	</main>

	<footer class="bg-white border-t mt-auto">
		<div class="w-full px-4 py-6 text-center text-gray-600 text-sm">
			<p>&copy; 2026 EasyRecipe. All rights reserved.</p>
			<div class="mt-2 space-x-4">
				<a href="/privacy" class="text-pink-dark hover:underline">Privacy Policy</a>
				<a href="/terms" class="text-pink-dark hover:underline">Terms of Service</a>
				<a href="/about" class="text-pink-dark hover:underline">About</a>
				<a href="/contact" class="text-pink-dark hover:underline">Contact</a>
			</div>
		</div>
	</footer>

	<script src="/js/utils.js"></script>
	<script src="/js/r.js"></script>
</body>
</html>
