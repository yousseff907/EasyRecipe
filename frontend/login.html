<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - EasyRecipe </title>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						'pink-light': '#FFE4E9',
						'pink-medium': '#FFB3C1',
						'pink-dark': '#FF8FA3',
					}
				}
			}
		}
	</script>
	<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<!-- AFTER (correct) -->

<body class="bg-gradient-to-br from-pink-light to-white min-h-screen flex flex-col">
	<header class="bg-white shadow-sm">
		<div class="w-full px-4 py-4">
			<a href="/home" class="text-2xl font-bold text-pink-dark">EasyRecipe</a>
		</div>
	</header>

	<!-- Main Content -->
	<div class="flex items-center justify-center p-4 py-12">
		<div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
			<!-- Header Inside Card -->
			<div class="text-center mb-8">
				<h2 class="text-3xl font-bold text-pink-dark mb-2">Welcome Back</h2>
				<p class="text-gray-600">Sign in to your account</p>
			</div>

			<!-- Email Form (Step 1) -->
			<div id="emailForm" class="space-y-4">
				<div>
					<label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
					<input type="email" id="email"
						class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none transition"
						placeholder="you@example.com">
				</div>
				<div class="flex justify-center">
					<div class="cf-turnstile" data-sitekey="0x4AAAAAAC1F2q-UG4qDNKOY"></div>
				</div>
				<button onclick="requestCode()"
					class="w-full bg-pink-dark hover:bg-pink-medium text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
					Send Verification Code
				</button>
			</div>

			<!-- Code Form (Step 2) - Hidden initially -->
			<div id="codeForm" class="space-y-4 hidden">
				<div>
					<label for="code" class="block text-sm font-medium text-gray-700 mb-2">Verification Code</label>
					<input type="text" id="code" maxlength="6"
						class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none transition text-center text-2xl tracking-widest"
						placeholder="000000">
				</div>
				<button onclick="verifyCode()"
					class="w-full bg-pink-dark hover:bg-pink-medium text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
					Verify Code
				</button>
				<button onclick="backToEmail()"
					class="w-full text-pink-dark hover:text-pink-medium font-medium transition">
					← Back to email
				</button>
			</div>

			<!-- Message Display -->
			<div id="message" class="mt-4 p-4 rounded-lg hidden"></div>
		</div>
	</div>

	<!-- Public Recipe Feed -->
	<div class="px-4 pb-12 max-w-md mx-auto w-full">
		<p class="text-center text-gray-400 text-xs mb-4 tracking-widest uppercase">Recently shared</p>
		<div class="relative">
			<div id="feedContainer" class="space-y-3 max-h-48 overflow-y-auto pb-6"
				style="scrollbar-width: none; -ms-overflow-style: none;"></div>
			<div
				class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-white to-transparent pointer-events-none">
			</div>
		</div>
	</div>

	<!-- Footer -->
	<footer class="bg-white border-t mt-auto">
		<div class="w-full px-4 py-6 text-center text-gray-600 text-sm">
			<p>&copy; 2026 EasyRecipe. All rights reserved.</p>
			<div class="mt-2 space-x-4">
				<a href="/privacy" class="text-pink-dark hover:underline">Privacy Policy</a>
				<a href="/terms" class="text-pink-dark hover:underline">Terms of Service</a>
				<a href="/about" class="text-pink-dark hover:underline">About</a>
				<a href="/contact" class="text-pink-dark hover:underline">Contact</a>
			</div>
		</div>
	</footer>



	<!-- Custom Styling -->
	<style>
		#feedContainer::-webkit-scrollbar {
			display: none;
		}
	</style>

	<script src="/js/login.js"></script>
</body>

</html>
