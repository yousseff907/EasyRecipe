<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Details - EasyRecipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pink-light': '#FFE4E9',
                        'pink-medium': '#FFB3C1',
                        'pink-dark': '#FF8FA3',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-pink-light to-white min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-pink-dark">EasyRecipe</h1>
            <nav class="space-x-4">
                <a href="/extract" class="text-gray-600 hover:text-pink-dark transition">Extract</a>
                <a href="/recipes" class="text-gray-600 hover:text-pink-dark transition">My Recipes</a>
                <button onclick="logout()" class="text-gray-600 hover:text-pink-dark transition">Logout</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Back Button -->
            <a href="/recipes" class="inline-flex items-center text-pink-dark hover:text-pink-medium mb-6 transition">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back to Recipes
            </a>

            <!-- Loading State -->
            <div id="loading" class="text-center py-8">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-pink-dark"></div>
                <p class="mt-4 text-gray-600">Loading recipe...</p>
            </div>

            <!-- Recipe Content -->
            <div id="recipeContent" class="hidden">
                <!-- Title -->
                <h2 id="recipeTitle" class="text-4xl font-bold text-gray-800 mb-6"></h2>
                
                <!-- Recipe Info -->
                <div class="grid grid-cols-3 gap-4 mb-8">
                    <div class="text-center p-4 bg-pink-light rounded-lg">
                        <p class="text-sm text-gray-600 mb-1">Prep Time</p>
                        <p id="prepTime" class="text-xl font-semibold text-pink-dark">-</p>
                    </div>
                    <div class="text-center p-4 bg-pink-light rounded-lg">
                        <p class="text-sm text-gray-600 mb-1">Cook Time</p>
                        <p id="cookTime" class="text-xl font-semibold text-pink-dark">-</p>
                    </div>
                    <div class="text-center p-4 bg-pink-light rounded-lg">
                        <p class="text-sm text-gray-600 mb-1">Servings</p>
                        <p id="servings" class="text-xl font-semibold text-pink-dark">-</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-4 mb-8">
                    <button 
                        onclick="downloadVideo()" 
                        class="flex-1 bg-pink-dark hover:bg-pink-medium text-white font-semibold py-3 rounded-lg transition shadow-md hover:shadow-lg"
                    >
                        Download Video
                    </button>
                    <button 
                        onclick="deleteRecipe()" 
                        class="px-6 bg-red-500 hover:bg-red-600 text-white font-semibold py-3 rounded-lg transition shadow-md hover:shadow-lg"
                    >
                        Delete
                    </button>
                </div>

                <!-- Ingredients -->
                <div class="mb-8">
                    <h3 class="text-2xl font-bold text-gray-800 mb-4">Ingredients</h3>
                    <ul id="ingredientsList" class="space-y-2 bg-pink-light p-6 rounded-lg"></ul>
                </div>

                <!-- Instructions -->
                <div>
                    <h3 class="text-2xl font-bold text-gray-800 mb-4">Instructions</h3>
                    <ol id="stepsList" class="space-y-4"></ol>
                </div>
            </div>

            <!-- Message Display -->
            <div id="message" class="mt-4 p-4 rounded-lg hidden"></div>
        </div>
    </main>

    <script src="/js/recipe.js"></script>
</body>
</html>
