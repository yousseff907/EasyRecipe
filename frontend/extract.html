<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract Recipe - EasyRecipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pink-light': '#FFE4E9',
                        'pink-medium': '#FFB3C1',
                        'pink-dark': '#FF8FA3',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-pink-light to-white min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-pink-dark">EasyRecipe</h1>
            <nav class="space-x-4">
                <a href="/extract" class="text-pink-dark font-semibold">Extract</a>
                <a href="/recipes" class="text-gray-600 hover:text-pink-dark transition">My Recipes</a>
                <button onclick="logout()" class="text-gray-600 hover:text-pink-dark transition">Logout</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Extract Recipe from Video</h2>
            
            <!-- URL Input -->
            <div class="space-y-4 mb-6">
                <div>
                    <label for="videoUrl" class="block text-sm font-medium text-gray-700 mb-2">
                        Video URL (TikTok, Instagram, or Facebook)
                    </label>
                    <input 
                        type="url" 
                        id="videoUrl" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none transition"
                        placeholder="https://tiktok.com/..."
                    >
                </div>
                <button 
                    onclick="extractRecipe()" 
                    id="extractBtn"
                    class="w-full bg-pink-dark hover:bg-pink-medium text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
                >
                    Extract Recipe
                </button>
            </div>

            <!-- Loading State -->
            <div id="loading" class="hidden text-center py-8">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-pink-dark"></div>
                <p class="mt-4 text-gray-600">Extracting recipe... This may take up to 60 seconds.</p>
            </div>

            <!-- Recipe Display -->
            <div id="recipeDisplay" class="hidden">
                <div class="border-t pt-6">
                    <h3 id="recipeTitle" class="text-2xl font-bold text-gray-800 mb-4"></h3>
                    
                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <div class="text-center p-3 bg-pink-light rounded-lg">
                            <p class="text-sm text-gray-600">Prep Time</p>
                            <p id="prepTime" class="text-lg font-semibold text-pink-dark">-</p>
                        </div>
                        <div class="text-center p-3 bg-pink-light rounded-lg">
                            <p class="text-sm text-gray-600">Cook Time</p>
                            <p id="cookTime" class="text-lg font-semibold text-pink-dark">-</p>
                        </div>
                        <div class="text-center p-3 bg-pink-light rounded-lg">
                            <p class="text-sm text-gray-600">Servings</p>
                            <p id="servings" class="text-lg font-semibold text-pink-dark">-</p>
                        </div>
                    </div>

                    <div class="mb-6">
                        <h4 class="text-xl font-semibold text-gray-800 mb-3">Ingredients</h4>
                        <ul id="ingredientsList" class="space-y-2"></ul>
                    </div>

                    <div>
                        <h4 class="text-xl font-semibold text-gray-800 mb-3">Instructions</h4>
                        <ol id="stepsList" class="space-y-3"></ol>
                    </div>
                </div>
            </div>

            <!-- Message Display -->
            <div id="message" class="mt-4 p-4 rounded-lg hidden"></div>
        </div>
    </main>

    <script src="/js/extract.js"></script>
</body>
</html>
