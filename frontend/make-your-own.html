<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Make Your Own Recipe - EasyRecipe </title>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						'pink-light': '#FFE4E9',
						'pink-medium': '#FFB3C1',
						'pink-dark': '#FF8FA3',
					}
				}
			}
		}
	</script>
</head>

<body class="bg-gradient-to-br from-pink-light to-white min-h-screen flex flex-col">
	<!-- Header with Hamburger Menu -->
	
	<header class="bg-white shadow-sm">
		<div class="w-full px-4 py-4">
			<!-- Desktop Header -->
			<div class="flex justify-between items-center">
				<h1 class="text-2xl font-bold text-pink-dark">EasyRecipe</h1>

				<div class="flex items-center gap-3">
					
					

					<!-- Hamburger Menu Button -->
					<button id="menuBtn" onclick="toggleMenu()"
						class="text-pink-dark hover:text-pink-medium transition focus:outline-none">
						<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
								d="M4 6h16M4 12h16M4 18h16"></path>
						</svg>
					</button>
				</div>
			</div>
		</div>

		<!-- Dropdown Menu -->
		<div id="mobileMenu"
			class="hidden absolute right-4 top-16 bg-white rounded-lg shadow-xl border-2 border-pink-light z-50 w-64">
				<nav class="py-2">
					<a href="/home"
						class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">Home</a>
					<a href="/recipes" class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">My
						Recipes</a>
					<a href="/search"
						class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">Search</a>
					<a href="/settings"
						class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">Profile &
						Settings</a>
					<hr class="my-2 border-pink-light">
					<button onclick="logout()"
						class="block w-full text-left px-6 py-3 text-red-600 hover:bg-red-50 transition">Logout</button>
				</nav>
		</div>
	</header>

	




	<!-- Main Content -->
	<main class="max-w-4xl mx-auto px-4 py-8">
		<div class="bg-white rounded-2xl shadow-xl p-8">
			<div class="text-center mb-8">
				<h2 class="text-3xl font-bold text-gray-800 mb-2">Create Your Own Recipe</h2>
				<p class="text-gray-600">Save your favorite family recipes and personal creations</p>
			</div>

			<form id="recipeForm" class="space-y-6">
				<!-- Recipe Title -->
				<div>
					<label for="title" class="block text-sm font-medium text-gray-700 mb-2">
						Recipe Title <span class="text-red-500">*</span>
					</label>
					<input type="text" id="title" required placeholder="e.g., Grandma's Chocolate Chip Cookies"
						class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
				</div>

				<!-- Recipe Info Grid -->
				<div class="grid grid-cols-3 gap-4">
					<div>
						<label for="prepTime" class="block text-sm font-medium text-gray-700 mb-2">
							Prep Time (min)
						</label>
						<input type="number" id="prepTime" min="0" placeholder="15"
							class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
					</div>
					<div>
						<label for="cookTime" class="block text-sm font-medium text-gray-700 mb-2">
							Cook Time (min)
						</label>
						<input type="number" id="cookTime" min="0" placeholder="30"
							class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
					</div>
					<div>
						<label for="servings" class="block text-sm font-medium text-gray-700 mb-2">
							Servings
						</label>
						<input type="number" id="servings" min="1" placeholder="4"
							class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
					</div>
					<!-- <div>
						<label for="serving_size" class="block text-sm font-medium text-gray-700 mb-2">
							Serving size
						</label>
						<input type="number" id="serving_size" min="1" placeholder="4"
							class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
					</div> -->
				</div>
				<div class="mt-4">
					<label for="servingSize" class="block text-sm font-medium text-gray-700 mb-2">
						Serving Size (optional)
						<span class="text-xs text-gray-500">e.g., 250g, 1 cup, 2 pieces</span>
					</label>
					<input type="text" id="serving_size" placeholder="250g"
						class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
				</div>

				<!-- Ingredients -->
				<div>
					<label for="ingredients" class="block text-sm font-medium text-gray-700 mb-2">
						Ingredients <span class="text-red-500">*</span>
						<span class="text-xs text-gray-500">(one per line, max 100)</span>
					</label>
					<textarea id="ingredients" rows="8" required placeholder="2 cups all-purpose flour
1 cup sugar
2 large eggs
1 tsp vanilla extract
1/2 cup butter, softened"
						class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none resize-none font-mono text-sm"></textarea>
				</div>

				<!-- Steps -->
				<div>
					<label for="steps" class="block text-sm font-medium text-gray-700 mb-2">
						Instructions <span class="text-red-500">*</span>
						<span class="text-xs text-gray-500">(one step per line, max 50)</span>
					</label>
					<textarea id="steps" rows="10" required placeholder="Preheat oven to 350°F (175°C)
Mix butter and sugar until fluffy
Add eggs one at a time, mixing well
Stir in vanilla extract
Gradually add flour and mix until combined
Drop spoonfuls onto baking sheet
Bake for 10-12 minutes until golden
Cool on wire rack" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none resize-none font-mono text-sm"></textarea>
				</div>

				<!-- Optional Nutrition Section -->
				<div class="border-t pt-6">
					<h3 class="text-lg font-semibold text-gray-800 mb-4">
						Nutritional Information
						<span class="text-sm font-normal text-gray-500">(Optional, per serving)</span>
					</h3>
					<div class="grid grid-cols-2 gap-4">
						<div>
							<label for="calories" class="block text-sm font-medium text-gray-700 mb-2">Calories</label>
							<input type="number" id="calories" min="0" placeholder="250"
								class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
						</div>
						<div>
							<label for="protein" class="block text-sm font-medium text-gray-700 mb-2">Protein
								(g)</label>
							<input type="number" id="protein" min="0" placeholder="8"
								class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
						</div>
						<div>
							<label for="carbs" class="block text-sm font-medium text-gray-700 mb-2">Carbs (g)</label>
							<input type="number" id="carbs" min="0" placeholder="35"
								class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
						</div>
						<div>
							<label for="fat" class="block text-sm font-medium text-gray-700 mb-2">Fat (g)</label>
							<input type="number" id="fat" min="0" placeholder="12"
								class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none">
						</div>
					</div>
				</div>

				<!-- Submit Button -->
				<button type="submit" id="submitBtn"
					class="w-full bg-pink-dark hover:bg-pink-medium text-white font-semibold py-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg text-lg">
					Save Recipe
				</button>
			</form>

			<!-- Message Display -->
			<div id="message" class="mt-4 p-4 rounded-lg hidden"></div>
		</div>
	</main>

	<!-- Footer -->
	<footer class="bg-white border-t">
		<div class="w-full px-4 py-6 text-center text-gray-600 text-sm">
			<p>&copy; 2026 EasyRecipe. All rights reserved.</p>
			<div class="mt-2 space-x-4">
				<a href="/privacy" class="text-pink-dark hover:underline">Privacy Policy</a>
				<a href="/terms" class="text-pink-dark hover:underline">Terms of Service</a>
				<a href="/about" class="text-pink-dark hover:underline">About</a>
				<a href="/contact" class="text-pink-dark hover:underline">Contact</a>
			</div>
		</div>
	</footer>

	<script src="/js/utils.js"></script>
	<script src="/js/make-your-own.js"></script>
</body>

</html>
