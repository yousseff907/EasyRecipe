<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Search - EasyRecipe</title>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						'pink-light': '#FFE4E9',
						'pink-medium': '#FFB3C1',
						'pink-dark': '#FF8FA3',
					}
				}
			}
		}
	</script>
</head>

<body class="bg-gradient-to-br from-pink-light to-white min-h-screen flex flex-col">
	<header class="bg-white shadow-sm">
		<div class="w-full px-4 py-4">
			<div class="flex justify-between items-center">
				<h1 class="text-2xl font-bold text-pink-dark">EasyRecipe</h1>
				<div class="flex items-center gap-3">
					<div id="google_translate_element"></div>
					<button id="menuBtn" onclick="toggleMenu()"
						class="text-pink-dark hover:text-pink-medium transition focus:outline-none">
						<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
								d="M4 6h16M4 12h16M4 18h16"></path>
						</svg>
					</button>
				</div>
			</div>
		</div>
		<div id="mobileMenu"
			class="hidden absolute right-4 top-16 bg-white rounded-lg shadow-xl border-2 border-pink-light z-50 w-64">
			<nav class="py-2">
				<a href="/extract"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">Extract
					from Video</a>
				<a href="/make-your-own"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">Make Your
					Own</a>
				<a href="/ai-recipe"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">AI Recipe
					Builder</a>
				<a href="/recipes"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">My
					Recipes</a>
				<a href="/favorites"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">My
					Favorites</a>
				<a href="/search"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">Search</a>
				<a href="/settings"
					class="block px-6 py-3 text-gray-700 hover:bg-pink-light hover:text-pink-dark transition">Profile &
					Settings</a>
				<hr class="my-2 border-pink-light">
				<button onclick="logout()"
					class="block w-full text-left px-6 py-3 text-red-600 hover:bg-red-50 transition">Logout</button>
			</nav>
		</div>
	</header>

	<script type="text/javascript">
		function googleTranslateElementInit() {
			new google.translate.TranslateElement({
				pageLanguage: 'en',
				includedLanguages: 'en,ar,fr,es,it,de,pt,ru,zh-CN,ja,ko,tr,hi',
				layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
				autoDisplay: false
			}, 'google_translate_element');
		}
	</script>
	<script type="text/javascript"
		src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

	<style>
		#google_translate_element {
			display: inline-block;
		}

		.goog-te-banner-frame.skiptranslate {
			display: none !important;
		}

		body {
			top: 0px !important;
		}

		.goog-te-combo {
			padding: 8px 12px;
			border: 2px solid #FFB3C1;
			border-radius: 8px;
			background-color: white;
			color: #FF8FA3;
			font-size: 14px;
			font-weight: 500;
			cursor: pointer;
			outline: none;
			transition: all 0.2s;
		}

		.goog-te-combo:hover {
			border-color: #FF8FA3;
			background-color: #FFE4E9;
		}

		.goog-te-combo:focus {
			border-color: #FF8FA3;
			box-shadow: 0 0 0 3px rgba(255, 179, 193, 0.3);
		}
	</style>

	<main class="max-w-4xl mx-auto px-4 py-8 w-full flex-1">
		<div class="bg-white rounded-2xl shadow-xl p-8">
			<h2 class="text-3xl font-bold text-gray-800 mb-6">Search</h2>

			<!-- Type Toggle -->
			<div class="flex rounded-lg overflow-hidden border-2 border-pink-dark mb-6 w-fit">
				<button id="btnRecipes" onclick="setType('recipes')"
					class="px-8 py-2 font-semibold transition bg-pink-dark text-white">
					Recipes
				</button>
				<button id="btnUsers" onclick="setType('users')"
					class="px-8 py-2 font-semibold transition bg-white text-pink-dark">
					Users
				</button>
			</div>

			<!-- Search Bar -->
			<div class="flex gap-3 mb-8">
				<input type="text" id="searchInput" placeholder="Search..."
					class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-medium focus:border-transparent outline-none transition"
					onkeydown="if(event.key === 'Enter') doSearch()">
				<button onclick="doSearch()"
					class="bg-pink-dark hover:bg-pink-medium text-white font-semibold px-6 py-3 rounded-lg transition shadow-md hover:shadow-lg">
					Search
				</button>
			</div>

			<!-- Loading -->
			<div id="loading" class="hidden text-center py-8">
				<div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-pink-dark"></div>
				<p class="mt-4 text-gray-600">Searching...</p>
			</div>

			<!-- Results -->
			<div id="results" class="hidden">
				<div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
			</div>

			<!-- Empty State -->
			<div id="emptyState" class="hidden text-center py-12">
				<p class="text-gray-500 text-lg">No results found.</p>
			</div>

			<!-- Message -->
			<div id="message" class="mt-4 p-4 rounded-lg hidden"></div>
		</div>
	</main>

	<footer class="bg-white border-t mt-auto">
		<div class="w-full px-4 py-6 text-center text-gray-600 text-sm">
			<p>&copy; 2026 EasyRecipe. All rights reserved.</p>
			<div class="mt-2 space-x-4">
				<a href="/privacy" class="text-pink-dark hover:underline">Privacy Policy</a>
				<a href="/terms" class="text-pink-dark hover:underline">Terms of Service</a>
				<a href="/about" class="text-pink-dark hover:underline">About</a>
				<a href="/contact" class="text-pink-dark hover:underline">Contact</a>
			</div>
		</div>
	</footer>

	<script src="/js/utils.js"></script>
	<script src="/js/search.js"></script>
</body>

</html>
