<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - EasyRecipe</title>
	<link rel="stylesheet" href="/output.css">
	<style>
		@keyframes float {

			0%,
			100% {
				transform: translateY(0px);
			}

			50% {
				transform: translateY(-12px);
			}
		}

		@keyframes wiggle {

			0%,
			100% {
				transform: rotate(-3deg);
			}

			50% {
				transform: rotate(3deg);
			}
		}

		.float {
			animation: float 3s ease-in-out infinite;
		}

		.wiggle {
			animation: wiggle 2s ease-in-out infinite;
		}
	</style>
    <meta property="og:image" content="https://easyrecipe.online/android-chrome-512x512.png">
    <meta property="og:image:type" content="image/png">
</head>

<body class="bg-gradient-to-br from-pink-light to-white min-h-screen flex flex-col items-center justify-center p-8">

	<div class="flex flex-col md:flex-row items-center gap-12 max-w-3xl w-full">

		<!-- Left: Text -->
		<div class="text-left flex-1">
			<p class="text-pink-dark font-bold text-lg mb-2 tracking-wide uppercase">Uh oh!</p>
			<h1 class="text-8xl font-bold text-gray-800 mb-4 leading-none">404</h1>
			<p class="text-gray-600 text-xl mb-2 font-semibold">Looks like that recipe got burned.</p>
			<p class="text-gray-400 text-sm mb-8">The page you're looking for doesn't exist or is private. Maybe go back
				and try a different recipe?</p>
			<a href="/"
				class="inline-block bg-pink-dark hover:bg-pink-medium text-white font-semibold px-8 py-3 rounded-xl transition shadow-md hover:shadow-lg">
				Back Home
			</a>
		</div>

		<!-- Right: Illustration -->
		<div class="flex-shrink-0 float">
			<svg width="220" height="280" viewBox="0 0 220 280" fill="none" xmlns="http://www.w3.org/2000/svg">

				<!-- Chef hat -->
				<ellipse cx="110" cy="80" rx="52" ry="14" fill="#FFB3C1" />
				<rect x="74" y="66" width="72" height="20" rx="4" fill="#FFB3C1" />
				<ellipse cx="110" cy="52" rx="38" ry="34" fill="white" stroke="#FFB3C1" stroke-width="3" />
				<!-- Hat puff bumps -->
				<ellipse cx="90" cy="44" rx="18" ry="16" fill="white" stroke="#FFB3C1" stroke-width="2" />
				<ellipse cx="110" cy="38" rx="20" ry="18" fill="white" stroke="#FFB3C1" stroke-width="2" />
				<ellipse cx="130" cy="44" rx="18" ry="16" fill="white" stroke="#FFB3C1" stroke-width="2" />

				<!-- Face -->
				<ellipse cx="110" cy="130" rx="46" ry="44" fill="#FFDDE5" />
				<!-- Sad eyes -->
				<ellipse cx="96" cy="122" rx="5" ry="6" fill="#FF8FA3" />
				<ellipse cx="124" cy="122" rx="5" ry="6" fill="#FF8FA3" />
				<!-- Sad mouth -->
				<path d="M98 144 Q110 136 122 144" stroke="#FF8FA3" stroke-width="3" stroke-linecap="round"
					fill="none" />
				<!-- Tear -->
				<ellipse cx="94" cy="135" rx="3" ry="4" fill="#B3D4FF" opacity="0.8" />

				<!-- Body -->
				<rect x="74" y="168" width="72" height="72" rx="16" fill="#FFB3C1" />
				<!-- Apron -->
				<rect x="88" y="170" width="44" height="68" rx="8" fill="white" opacity="0.6" />
				<!-- Apron strings -->
				<rect x="88" y="170" width="8" height="4" rx="2" fill="#FF8FA3" />
				<rect x="124" y="170" width="8" height="4" rx="2" fill="#FF8FA3" />

				<!-- Arms -->
				<rect x="44" y="172" width="32" height="18" rx="9" fill="#FFDDE5" />
				<rect x="144" y="172" width="32" height="18" rx="9" fill="#FFDDE5" />

				<!-- Burnt pan in left hand -->
				<rect x="28" y="184" width="36" height="22" rx="4" fill="#888" />
				<rect x="20" y="190" width="12" height="6" rx="3" fill="#555" />
				<!-- Smoke puffs -->
				<ellipse cx="38" cy="178" rx="5" ry="5" fill="#ccc" opacity="0.7" class="wiggle" />
				<ellipse cx="48" cy="172" rx="4" ry="4" fill="#ccc" opacity="0.5" class="wiggle" />
				<ellipse cx="32" cy="170" rx="3" ry="3" fill="#ccc" opacity="0.4" class="wiggle" />

				<!-- Recipe book in right hand (closed, sad) -->
				<rect x="148" y="180" width="30" height="36" rx="4" fill="#FF8FA3" />
				<rect x="150" y="182" width="26" height="32" rx="3" fill="#FFE4E9" />
				<rect x="153" y="188" width="20" height="2" rx="1" fill="#FFB3C1" />
				<rect x="153" y="193" width="16" height="2" rx="1" fill="#FFB3C1" />
				<rect x="153" y="198" width="18" height="2" rx="1" fill="#FFB3C1" />

				<!-- Legs -->
				<rect x="88" y="234" width="18" height="36" rx="9" fill="#FFDDE5" />
				<rect x="114" y="234" width="18" height="36" rx="9" fill="#FFDDE5" />
				<!-- Shoes -->
				<ellipse cx="97" cy="270" rx="14" ry="8" fill="#FF8FA3" />
				<ellipse cx="123" cy="270" rx="14" ry="8" fill="#FF8FA3" />
			</svg>
		</div>

	</div>

</body>

</html>
