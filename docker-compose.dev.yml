name: easyrecipe-dev

services:
  backend:
    build:
      context: ./backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/
    env_file:
      - path: ./.env
        required: false
    environment:
      DEV_MODE: "1"
      SITE_DOMAIN: localhost
      DATABASE_URL: sqlite:///./database.dev.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-do-not-use-in-production}
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured.apps.googleusercontent.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-configured}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}

  nginx:
    build:
      context: ./nginx
    environment:
      SITE_DOMAIN: localhost
      CONTACT_EMAIL: ${CONTACT_EMAIL:-dev@localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured.apps.googleusercontent.com}
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/dev.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
