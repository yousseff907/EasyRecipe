events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;

	map $uri $limit_heavy {
		~^/api/(extract|make_your_own_with_ai)$ $binary_remote_addr;
		~^/api/recipes/[0-9]+/(pdf|download-video)$ $binary_remote_addr;
		default "";
	}

	map $uri $limit_auth {
		~^/api/auth/ $binary_remote_addr;
		default "";
	}

	limit_req_zone $limit_heavy zone=heavy:10m rate=5r/m;
	limit_req_zone $limit_auth zone=auth:10m rate=5r/m;
	limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
	limit_req_status 429;

	include /etc/nginx/conf.d/*.conf;
}
