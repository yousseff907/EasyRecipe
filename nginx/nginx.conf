events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;

	server {
		listen 80;
		server_name easyrecipe.online www.easyrecipe.online;
		return 301 https://$server_name$request_uri;
	}

	server {
		listen 443 ssl;
		server_name easyrecipe.online www.easyrecipe.online;

		ssl_certificate /etc/letsencrypt/live/easyrecipe.online/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/easyrecipe.online/privkey.pem;

		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers on;

		location ~ \.php$ {
			return 302 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
		}

		location ~ /\.env {
			return 302 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
		}

		location ~ /(wp-admin|wp-content|wp-includes|vendor|phpunit) {
			return 302 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
		}

		location ~ docker-compose {
			return 302 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
		}

		location /user/ {
			root /usr/share/nginx/html;
			try_files /profile.html =404;
		}

		location / {
			root /usr/share/nginx/html;
			index login.html;
			try_files $uri $uri.html $uri/ =404;
		}

		location /api/ {
			proxy_pass http://backend:8000;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}