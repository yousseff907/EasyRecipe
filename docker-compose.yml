version: '3.8'

services:
  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app/
    env_file:
      - ./.env
  nginx:
    restart: always
    build:
      context: ./nginx
      dockerfile: Dockerfile
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      - CONTACT_EMAIL=${CONTACT_EMAIL:?Set CONTACT_EMAIL in .env}
    volumes:
      - ./frontend:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt:ro 
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend